ServerName localhost
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /workspace/src
    DirectoryIndex ui.php

    <Directory /workspace/src>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        php_admin_value auto_prepend_file /opt/website-backup-dev/bootstrap.php
    </Directory>

    # Ces dossiers restent privés, y compris leurs fichiers JS/CSS et PHP.
    <LocationMatch "^/(Config|vendor)(/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    # Ne pas enregistrer les paramètres d'URL ni les en-têtes d'authentification.
    CustomLog /proc/self/fd/1 "%h %t \"%m %U %H\" %>s %b"
</VirtualHost>
